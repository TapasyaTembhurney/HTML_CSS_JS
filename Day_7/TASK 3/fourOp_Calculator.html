<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fourOp_Calci.css">
</head>
<body>
    <div id="calci">
        <table>
            <tr>
                <td><input type="number" id="inp1"></td>
                <td><button id="inp-op"></button></td>
                <!-- <td>
                    <select name="" id="inp-op">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">*</option>
                        <option value="/">/</option>
                    </select>
                </td> -->
                <td><input type="number" id="inp2"></td>
            </tr>
        </table>
        <br>

        <div id="op">
            <table>
                <tr id="op">
                    <td><button value="+">+</button></td>
                    <td><button value="-">-</button></td>
                    <td><button value="*">*</button></td>
                    <td><button value="/">/</button></td>
                </tr>
            </table>
        </div>

        <div id="solve">
            <button id="clr">Clear</button>
            <button id="eq" onclick="handleSolve()">=</button>
        </div>

        <div id="display">

        </div>
    </div>

</body>

<script>
    function handleSolve(){
        let a = document.getElementById('inp1').value;
        let b = document.getElementById('inp-op').value
        let c = document.getElementById('inp2').value;

        let res = eval(`${a}${b}${c}`);
        alert("The equation is solved");
        document.getElementById('display').textContent = res;
        
    }
</script>
</html>
