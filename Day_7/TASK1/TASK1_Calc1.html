<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="TASK1_Calc1.css">
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/15.1.0/math.js"
    integrity="sha512-3y6BeMscN23skftXPwx0f5RI6brbJlEfaZ3KInpeIkKjFunP4toeg9XyEsSo4zq+7ZqvHJvD9S2WFIk0yT5mzw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<body>
    <div id="calculator">
        <table border="2">
            <tr id="ins">
                <td><input type="text" id="input1"></td>
                <td><input type="button" id="input2"></td>
                <td><input type="text" id="input3"></td>
            </tr>

            <tr>
                <td colspan="2"><input type="button" id="eq_op" value="=" onclick="handleSolve()"></td>
                <td colspan="2"><input type="button" id="result"></td>
            </tr>
        </table>
    </div>
    <br><br>

    <table>
        <tr id="operators">
            <td><button value="+" onclick="handleDisplay('+')" id="op">+</button></td>
            <td><button value="-" onclick="handleDisplay('-')" id="op">-</button></td>
            <td><button value="*" onclick="handleDisplay('*')" id="op">*</button></td>
            <td><button value="/" onclick="handleDisplay('/')" id="op">/</button></td>
        </tr>
    </table>
</body>

<script>

    function handleDisplay(val) {
        document.getElementById('input2').value = val;
    }

    function handleSolve() {
        let a = document.getElementById('input1').value;
        let b = document.getElementById('input2').value;
        let c = document.getElementById('input3').value;
        let res = math.evaluate(`${a}${b}${c}`);
        document.getElementById('result').value = res;
    }


</script>

</html>
