<script>
    // ---------------------------Largest Number--------------------------
    function largest_num(x , y){
        if(x > y){
            return "x is largest number";
        }
        else {
            return "y is largest number";
        }
    }

    let x = Number(prompt("Enter first number : "));
    let y = Number(prompt("Enter second number : "));
    
    let larg_num = largest_num(x , y);

    console.log(larg_num);
</script>
