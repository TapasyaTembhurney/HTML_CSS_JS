<script>
    let num = Number(prompt("Enter a number"));
    let i;

    function factorial(num){
        if(num == 0){
            return 1;
        }
        else if(num != 0){
            for(i = 1; i <= num ; i++){
                num *= i;
            }
        }
    }

    let fact = factorial(num);
    console.log(fact);

</script>
