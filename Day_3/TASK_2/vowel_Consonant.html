<script>
    let input = prompt("Enter an input");

    function vowelConsonant(input){
        if(input == 'a'||input == 'e' || input == 'i' || input == 'o' || input == 'u'){
            return "The input is vowel!";
        }
        else{
            return "The input is consonant!";
        }
    }

    let alphabet = vowelConsonant(input);
    console.log(alphabet);
</script>
