<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button ondblclick="onDblClick(event)">Click Me</button>
    <p id="click"></p>
</body>

<script>
    function onDblClick(event){
        document.getElementById(click).innerHTML = event.target
    }
</script>
</html>
