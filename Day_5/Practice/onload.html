<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body onload="handleOnLoad(event)">
    <input type="text" name="" id="">
    <p id="name">You are amazing</p>
</body>

<script>
    function handleOnLoad(event){
        document.getElementById('name').innerHTML = event.value;
    }
</script>
</html>
