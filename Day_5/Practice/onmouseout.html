<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onmouseout="handleOnMouseOut(event)">Click Me!</button>
    <p id="main"></p>

</body>

<script>
    function handleOnMouseOut(event){
        document.getElementById('main').innerHTML = event.target.tagName
    }
</script>
</html>
